<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SyncBridge{% endblock %} · SyncBridge</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Sync<span>Bridge</span> · <small class="muted">workflow automation</small></div>
    <nav>
      <a href="/" class="{% block nav_flows %}{% endblock %}">Flows</a>
      <a href="/runs" class="{% block nav_runs %}{% endblock %}">Runs</a>
    </nav>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    SyncBridge — a showcase project by
    <a href="https://mohamedadelmamoun.com">Mohamed Adel Mamoun</a>.
    Proves the “Automation + APIs” service area. All flows and data are fictional.
  </div>
</body>
</html>
